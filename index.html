<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Heroes 3 JS</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app">
      <div class="game-shell" data-player-color="red">
        <div class="adventure-frame">
          <div class="viewport" aria-label="Viewport">
            <div class="world" aria-label="World">
              <div class="terrain-layer" aria-label="Terrain"></div>
              <div class="entity-layer" aria-label="Entities"></div>
              <div class="effects-layer" aria-label="Effects"></div>
            </div>
          </div>
        </div>
        <aside class="ui-layer adventure-panel" aria-label="UI">
          <div class="minimap" aria-label="Minimap">
            <div class="minimap__map" id="minimap-map">
              <div class="minimap__terrain" id="minimap-terrain"></div>
              <div class="minimap__towns" id="minimap-towns"></div>
              <div class="minimap__heroes" id="minimap-heroes"></div>
              <div class="minimap__viewport" id="minimap-viewport"></div>
            </div>
          </div>
          <div class="adventure-lists">
            <ul class="hero-list" id="hero-list" aria-label="Heroes"></ul>
            <div class="adventure-buttons">
                <button class="adventure-button" id="kingdom-overview-button" type="button" aria-label="Kingdom overview" title="Kingdom overview (not available yet)" disabled>
                  <svg class="adventure-button__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V9l4 3 4-6 4 6 4-3v11z"/></svg>
                </button>
                <button class="adventure-button" id="underground-button" type="button" aria-label="Underground" title="Underground (not available yet)" disabled>
                  <svg class="adventure-button__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17l5-7 4 5 3-3 6 5z"/><circle cx="17" cy="7" r="2"/></svg>
                </button>
                <button class="adventure-button" id="quest-log-button" type="button" aria-label="Quest log" title="Quest log (not available yet)" disabled>
                  <svg class="adventure-button__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h10l2 3v15H6z"/><path d="M9 9h6M9 13h6M9 17h4" class="adventure-button__line"/></svg>
                </button>
                <button class="adventure-button" id="sleep-hero-button" type="button" aria-label="Sleep hero" title="Sleep hero (not available yet)" disabled>
                  <svg class="adventure-button__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4a8 8 0 1 0 6 12 7 7 0 0 1-6-12z"/></svg>
                </button>
                <button class="adventure-button" id="move-hero-button" type="button" aria-label="Move hero" title="Move hero" disabled>
                  <svg class="adventure-button__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h5l1 9 5 3v4H7z"/><path d="M5 21h14" class="adventure-button__line"/></svg>
                </button>
                <button class="adventure-button" id="cast-spell-button" type="button" aria-label="Cast spell" title="Cast spell (not available yet)" disabled>
                  <svg class="adventure-button__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h6a2 2 0 0 1 2 2v14a2 2 0 0 0-2-2H5zM19 4h-4a2 2 0 0 0-2 2v14a2 2 0 0 1 2-2h4z"/></svg>
                </button>
                <button class="adventure-button" id="adventure-options-button" type="button" aria-label="Adventure options" title="Adventure options (not available yet)" disabled>
                  <svg class="adventure-button__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l3 6 6 1-4.5 4 1 6-5.5-3-5.5 3 1-6L3 10l6-1z"/></svg>
                </button>
                <button class="adventure-button" id="system-options-button" type="button" aria-label="System options" title="System options">
                  <svg class="adventure-button__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm8 4l2-2-2-3-3 1-1-3h-3l-1 3-3-1-2 3 2 2-2 2 2 3 3-1 1 3h3l1-3 3 1 2-3z" fill-rule="evenodd"/></svg>
                </button>
                <button class="adventure-button" id="next-hero-button" type="button" aria-label="Next hero" title="Next hero">
                  <svg class="adventure-button__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h9V4l7 8-7 8v-4H4z"/></svg>
                </button>
                <button class="adventure-button" id="end-turn-button" type="button" aria-label="End turn" title="End turn">
                  <svg class="adventure-button__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v2l-4 7 4 7v2H6v-2l4-7-4-7z"/></svg>
                </button>
            </div>
            <div class="town-list" aria-label="Towns">
              <span class="town-list__slot"></span>
              <span class="town-list__slot"></span>
              <span class="town-list__slot"></span>
              <span class="town-list__slot"></span>
              <span class="town-list__slot"></span>
            </div>
          </div>
          <section class="info-box" id="hero-info" aria-label="Hero info">
            <h2 class="info-box__name" id="hero-info-name"></h2>
            <ul class="info-box__army" aria-label="Army">
                <li class="army-slot"></li>
                <li class="army-slot"></li>
                <li class="army-slot"></li>
                <li class="army-slot"></li>
                <li class="army-slot"></li>
                <li class="army-slot"></li>
                <li class="army-slot"></li>
            </ul>
          </section>
        </aside>
        <div class="resource-bar">
          <ul class="resource-bar__list" id="resource-bar-list" aria-label="Resources"></ul>
          <div class="resource-bar__date" id="calendar-status">Month: 1, Week: 1, Day: 1</div>
        </div>
      </div>
    </div>

    <script type="module" src="./main.js"></script>
  </body>
</html>
