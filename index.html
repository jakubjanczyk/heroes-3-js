  <body>
    <div class="app">
      <div class="game-shell" data-player-color="red">
        <div class="adventure-frame">
          <div class="viewport" aria-label="Viewport">
            <div class="world" aria-label="World">
              <div class="terrain-layer" aria-label="Terrain"></div>
              <div class="entity-layer" aria-label="Entities"></div>
              <div class="effects-layer" aria-label="Effects"></div>
            </div>
          </div>
        </div>
        <aside class="ui-layer adventure-panel" aria-label="UI">
          <div class="minimap" aria-label="Minimap">
            <div class="minimap__map" id="minimap-map">
              <div class="minimap__terrain" id="minimap-terrain"></div>
              <div class="minimap__towns" id="minimap-towns"></div>
              <div class="minimap__heroes" id="minimap-heroes"></div>
              <div class="minimap__viewport" id="minimap-viewport"></div>
            </div>
          </div>
          <div class="adventure-lists">
            <ul class="hero-list" id="hero-list" aria-label="Heroes"></ul>
            <div class="adventure-buttons">
                <button class="adventure-button" id="kingdom-overview-button" type="button" aria-label="Kingdom overview" title="Kingdom overview (not available yet)" disabled>
                  <svg class="adventure-button__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V9l4 3 4-6 4 6 4-3v11z"/></svg>
                </button>
                <button class="adventure-button" id="underground-button" type="button" aria-label="Underground" title="Underground (not available yet)" disabled>
                  <svg class="adventure-button__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17l5-7 4 5 3-3 6 5z"/><circle cx="17" cy="7" r="2"/></svg>
                </button>
                <button class="adventure-button" id="quest-log-button" type="button" aria-label="Quest log" title="Quest log (not available yet)" disabled>
                  <svg class="adventure-button__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h10l2 3v15H6z"/><path d="M9 9h6M9 13h6M9 17h4" class="adventure-button__line"/></svg>
                </button>
                <button class="adventure-button" id="sleep-hero-button" type="button" aria-label="Sleep hero" title="Sleep hero (not available yet)" disabled>
                  <svg class="adventure-button__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4a8 8 0 1 0 6 12 7 7 0 0 1-6-12z"/></svg>
                </button>
                <button class="adventure-button" id="move-hero-button" type="button" aria-label="Move hero" title="Move hero" disabled>
                  <svg class="adventure-button__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h5l1 9 5 3v4H7z"/><path d="M5 21h14" class="adventure-button__line"/></svg>
                </button>
                <button class="adventure-button" id="cast-spell-button" type="button" aria-label="Cast spell" title="Cast spell (not available yet)" disabled>
                  <svg class="adventure-button__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h6a2 2 0 0 1 2 2v14a2 2 0 0 0-2-2H5zM19 4h-4a2 2 0 0 0-2 2v14a2 2 0 0 1 2-2h4z"/></svg>
                </button>
                <button class="adventure-button" id="adventure-options-button" type="button" aria-label="Adventure options" title="Adventure options (not available yet)" disabled>
                  <svg class="adventure-button__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l3 6 6 1-4.5 4 1 6-5.5-3-5.5 3 1-6L3 10l6-1z"/></svg>
                </button>
                <button class="adventure-button" id="system-options-button" type="button" aria-label="System options" title="System options">
                  <svg class="adventure-button__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm8 4l2-2-2-3-3 1-1-3h-3l-1 3-3-1-2 3 2 2-2 2 2 3 3-1 1 3h3l1-3 3 1 2-3z" fill-rule="evenodd"/></svg>
                </button>
                <button class="adventure-button" id="next-hero-button" type="button" aria-label="Next hero" title="Next hero">
                  <svg class="adventure-button__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h9V4l7 8-7 8v-4H4z"/></svg>
                </button>
                <button class="adventure-button" id="end-turn-button" type="button" aria-label="End turn" title="End turn">
                  <svg class="adventure-button__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v2l-4 7 4 7v2H6v-2l4-7-4-7z"/></svg>
                </button>
            </div>
            <ul class="town-list" id="town-list" aria-label="Towns"></ul>
          </div>
          <section class="info-box hero-box" id="hero-info" aria-label="Hero info"></section>
        </aside>
        <div class="status-bar" id="status-bar" role="status" aria-label="Status bar"></div>
        <div class="resource-bar">
          <ul class="resource-bar__list" id="resource-bar-list" aria-label="Resources"></ul>
          <div class="resource-bar__date" id="calendar-status">Month: 1, Week: 1, Day: 1</div>
        </div>
      </div>
    </div>

    <!--
      The Heroes 3 hero box, cloned into the info box and the hero's right-click popup. The skill
      icons are stand-ins for the game's: crossed swords, shield, spell book and books.
    -->
    <template id="hero-box-template">
      <div class="hero-box__portrait" role="img"></div>
      <h2 class="hero-box__name"></h2>
      <ul class="hero-box__skills primary-skills" aria-label="Primary skills">
        <li class="primary-skills__skill" data-skill="attack" title="Attack">
          <svg class="primary-skills__icon" viewBox="0 0 24 24" role="img" aria-label="Attack"><path d="M4 4l16 16M20 4L4 20M3 15l6 6M15 21l6-6"/></svg>
          <span class="primary-skills__value"></span>
        </li>
        <li class="primary-skills__skill" data-skill="defense" title="Defense">
          <svg class="primary-skills__icon" viewBox="0 0 24 24" role="img" aria-label="Defense"><path d="M12 2l8 3v6c0 5-3.5 9-8 11-4.5-2-8-6-8-11V5z"/></svg>
          <span class="primary-skills__value"></span>
        </li>
        <li class="primary-skills__skill" data-skill="power" title="Power">
          <svg class="primary-skills__icon" viewBox="0 0 24 24" role="img" aria-label="Power"><path d="M2 5c3-1 7-1 10 1 3-2 7-2 10-1v14c-3-1-7-1-10 1-3-2-7-2-10-1zM12 6v14"/></svg>
          <span class="primary-skills__value"></span>
        </li>
        <li class="primary-skills__skill" data-skill="knowledge" title="Knowledge">
          <svg class="primary-skills__icon" viewBox="0 0 24 24" role="img" aria-label="Knowledge"><path d="M4 3h4v18H4zM10 3h4v18h-4zM16 4l3.5-1 2.5 17-3.5 1z"/></svg>
          <span class="primary-skills__value"></span>
        </li>
      </ul>
      <ul class="hero-box__army" aria-label="Army">
        <li class="army-slot"></li>
        <li class="army-slot"></li>
        <li class="army-slot"></li>
        <li class="army-slot"></li>
        <li class="army-slot"></li>
        <li class="army-slot"></li>
        <li class="army-slot"></li>
      </ul>
    </template>

    <!--
      The Heroes 3 town box, cloned into the info box and the right-click popup of the player's own
      town: its picture and name, its Hall and Fort icons, the gold it earns a day and its garrison.
    -->
    <template id="town-box-template">
      <div class="town-box__picture" aria-hidden="true"></div>
      <h2 class="town-box__name"></h2>
      <div class="town-box__buildings" role="group" aria-label="Buildings">
        <span class="town-box__hall" role="img"></span>
        <span class="town-box__fort" role="img"></span>
      </div>
      <span class="town-box__income" aria-label="Daily income" title="Daily income"></span>
      <ul class="town-box__garrison" aria-label="Garrison">
        <li class="army-slot"></li>
        <li class="army-slot"></li>
        <li class="army-slot"></li>
        <li class="army-slot"></li>
        <li class="army-slot"></li>
        <li class="army-slot"></li>
        <li class="army-slot"></li>
      </ul>
    </template>

    <!--
      The Heroes 3 battle screen, laid over the adventure screen when a battle starts. The hexes
      and stacks are added for each battle. Icons are stand-ins for the game's; Retreat, Auto combat,
      Wait and Defend work so far, and Surrender only against an enemy hero, which there is none of yet. `aria-keyshortcuts` gives a button its keys (keyboard-shortcuts.module.js).
    -->
    <template id="battle-screen-template">
      <section class="battle-screen" role="dialog" aria-modal="true" aria-label="Battle">
        <div class="battle-screen__field">
          <div class="battle-screen__ground" aria-label="Battlefield ground"></div>
          <div class="battle-screen__sky" aria-hidden="true"></div>
          <div class="battle-hero battle-hero--attacker" role="img"></div>
          <div class="battlefield" role="grid" aria-label="Battlefield" aria-rowcount="11" aria-colcount="15"></div>
        </div>
        <div class="battle-bar">
          <button class="battle-button" type="button" aria-label="System options" title="System options (not available yet)" disabled>
            <svg class="battle-button__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5zM8 8h8M8 12h8M8 16h5"/></svg>
          </button>
          <button class="battle-button" type="button" aria-label="Surrender" title="Neutral creatures do not accept surrender" disabled>
            <svg class="battle-button__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 21V3M6 4h11l-3 4 3 4H6"/></svg>
          </button>
          <button class="battle-button" type="button" data-battle-action="retreat" aria-label="Retreat" aria-keyshortcuts="R" title="Retreat (R)" disabled>
            <svg class="battle-button__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M13 4a2 2 0 1 0 0 .1M9 21l3-7 3 3v4M12 14l-1-5 4 2 3-1M11 9l-4 3"/></svg>
          </button>
          <button class="battle-button" type="button" data-battle-action="auto-combat" aria-label="Auto combat" aria-keyshortcuts="A" aria-pressed="false" title="Auto combat (A)">
            <svg class="battle-button__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4l16 16M20 4L4 20M3 15l6 6M15 21l6-6"/></svg>
          </button>
          <div class="battle-bar__log" role="log" aria-label="Combat messages"></div>
          <div class="battle-bar__scroll" aria-hidden="true">
            <span class="battle-bar__arrow battle-bar__arrow--up"></span>
            <span class="battle-bar__arrow battle-bar__arrow--down"></span>
          </div>
          <button class="battle-button" type="button" aria-label="Cast spell" title="Cast spell (not available yet)" disabled>
            <svg class="battle-button__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h6a2 2 0 0 1 2 2v14a2 2 0 0 0-2-2H5zM19 4h-4a2 2 0 0 0-2 2v14a2 2 0 0 1 2-2h4z"/></svg>
          </button>
          <button class="battle-button" type="button" data-battle-action="wait" aria-label="Wait" aria-keyshortcuts="W" title="Wait (W)" disabled>
            <svg class="battle-button__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v2l-4 7 4 7v2H6v-2l4-7-4-7z"/></svg>
          </button>
          <button class="battle-button" type="button" data-battle-action="defend" aria-label="Defend" aria-keyshortcuts="D Space" title="Defend (D or Space)" disabled>
            <svg class="battle-button__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l8 3v6c0 5-3.5 9-8 11-4.5-2-8-6-8-11V5z"/></svg>
          </button>
        </div>
        <div class="battle-screen__status-bar" role="status" aria-label="Battle status bar"></div>
      </section>
    </template>

    <!-- Asked before the hero runs from the battle, as in Heroes 3. -->
    <template id="battle-retreat-template">
      <div class="battle-overlay" role="dialog" aria-modal="true" aria-label="Retreat">
        <div class="battle-overlay__window battle-retreat message-box">
          <p class="battle-retreat__question">Are you sure you want to retreat?</p>
          <div class="battle-overlay__actions">
            <button class="interaction-modal__ok-button" type="button" data-battle-action="confirm-retreat" aria-label="OK" aria-keyshortcuts="Enter">
              <svg class="interaction-modal__ok-check" viewBox="0 0 24 16" aria-hidden="true"><path d="M5 8.5 L9.5 13 L19 3" /></svg>
            </button>
            <button class="interaction-modal__ok-button" type="button" data-battle-action="cancel-retreat" aria-label="Cancel" aria-keyshortcuts="Escape">
              <svg class="battle-overlay__cancel" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8" /><path d="M6.5 17.5 17.5 6.5" /></svg>
            </button>
          </div>
        </div>
      </div>
    </template>

    <!--
      The Heroes 3 results window over the darkened battle: each side with its outcome, what
      became of the hero and the creatures each side lost. No pictures yet: stand-ins for the
      portraits and the creatures.
    -->
    <template id="battle-results-template">
      <div class="battle-overlay battle-results" role="dialog" aria-modal="true" aria-label="Battle results">
        <div class="battle-overlay__window battle-results__window message-box">
          <div class="battle-results__sides">
            <div class="battle-results__side" role="group" aria-label="Attacker">
              <p class="battle-results__name"></p>
              <p class="battle-results__outcome"></p>
            </div>
            <div class="battle-results__side battle-results__side--defender" role="group" aria-label="Defender">
              <p class="battle-results__name"></p>
              <p class="battle-results__outcome"></p>
            </div>
          </div>
          <div class="battle-results__message" role="group" aria-label="Battle outcome"></div>
          <h2 class="battle-results__title">Battlefield Casualties</h2>
          <div class="battle-results__casualties" role="group" aria-label="Attacker casualties">
            <h3 class="battle-results__heading">Attacker</h3>
            <ul class="battle-results__creatures"></ul>
          </div>
          <div class="battle-results__casualties" role="group" aria-label="Defender casualties">
            <h3 class="battle-results__heading">Defender</h3>
            <ul class="battle-results__creatures"></ul>
          </div>
          <div class="battle-overlay__actions">
            <button class="interaction-modal__ok-button" type="button" data-battle-action="close-results" aria-label="OK" aria-keyshortcuts="Enter">
              <svg class="interaction-modal__ok-check" viewBox="0 0 24 16" aria-hidden="true"><path d="M5 8.5 L9.5 13 L19 3" /></svg>
            </button>
          </div>
        </div>
      </div>
    </template>

    <!-- A creature stack on a battlefield hex: the creature (a stand-in for its picture) and its count. -->
    <template id="battle-stack-template">
      <div class="battle-stack">
        <div class="battle-stack__creature entity--monster" role="img"></div>
        <span class="battle-stack__count"></span>
      </div>
    </template>

    <!--
      Laid out as in Heroes 3. The picture shows the town's buildings, drawn by town-screen-view; the
      status bar under the panel names what is under the mouse (a building, a panel icon
      or creature, an army slot's action). The Hall icon opens the Hall; the Fort
      icon, shown once the town has a Fort, opens the Fort window; the last frame shows the gold the
      town earns a day.
    -->
    <template id="town-screen-template">
      <section class="town-screen" role="dialog" aria-modal="true" aria-label="Town">
        <div class="town-screen__view" role="group" aria-label="Town picture"></div>
        <div class="town-panel">
          <div class="town-panel__summary">
            <div class="town-panel__picture" aria-hidden="true"></div>
            <h2 class="town-panel__name"></h2>
            <div class="town-panel__buildings">
              <button class="town-panel__frame town-panel__hall" type="button" data-town-action="hall" aria-label="Hall" title="Hall"></button>
              <span class="town-panel__frame town-panel__fort-frame">
                <button class="town-panel__fort" type="button" data-town-action="fort" hidden></button>
              </span>
              <span class="town-panel__frame town-panel__income" aria-label="Daily income" title="Daily income"></span>
            </div>
            <ul class="town-panel__growth" aria-label="Creature growth">
              <li class="town-panel__frame creature-growth"></li>
              <li class="town-panel__frame creature-growth"></li>
              <li class="town-panel__frame creature-growth"></li>
              <li class="town-panel__frame creature-growth"></li>
              <li class="town-panel__frame creature-growth"></li>
              <li class="town-panel__frame creature-growth"></li>
              <li class="town-panel__frame creature-growth"></li>
              <li class="town-panel__frame" aria-hidden="true"></li>
            </ul>
          </div>
          <div class="town-panel__armies">
            <div class="town-panel__row">
              <div class="town-panel__hero" aria-hidden="true"></div>
              <ul class="town-panel__slots" aria-label="Garrison" data-army="garrison">
                <li class="army-slot"></li>
                <li class="army-slot"></li>
                <li class="army-slot"></li>
                <li class="army-slot"></li>
                <li class="army-slot"></li>
                <li class="army-slot"></li>
                <li class="army-slot"></li>
              </ul>
            </div>
            <div class="town-panel__row">
              <div class="town-panel__hero town-panel__hero--visiting" role="img"></div>
              <ul class="town-panel__slots" aria-label="Visiting hero army" data-army="hero">
                <li class="army-slot"></li>
                <li class="army-slot"></li>
                <li class="army-slot"></li>
                <li class="army-slot"></li>
                <li class="army-slot"></li>
                <li class="army-slot"></li>
                <li class="army-slot"></li>
              </ul>
            </div>
          </div>
          <div class="town-panel__side">
            <ul class="town-panel__town-list" aria-label="Towns"></ul>
            <button class="town-panel__leave" type="button" data-town-action="leave" data-status="Leave town" aria-label="Leave town" aria-keyshortcuts="Enter Escape" title="Leave town (Enter)">
              <svg class="town-panel__leave-check" viewBox="0 0 24 16" aria-hidden="true"><path d="M5 8.5 L9.5 13 L19 3" /></svg>
            </button>
          </div>
        </div>
        <div class="town-screen__status-bar" role="status" aria-label="Town status bar"></div>
      </section>
    </template>

    <!--
      The Hall, where a town builds: a window over the darkened town screen, with rows of building
      slots, each a picture (a stand-in for now) over a bar whose colour says whether the building
      stands, can be built, or why not.
    -->
    <template id="town-hall-template">
      <div class="town-hall-backdrop">
        <section class="town-hall" role="dialog" aria-modal="true" aria-label="Hall">
          <h2 class="town-hall__title"></h2>
          <div class="town-hall__rows"></div>
          <button class="town-hall__close" type="button" data-hall-action="close" aria-label="Close" aria-keyshortcuts="Enter Escape" title="Close (Enter)">
            <svg class="town-hall__check" viewBox="0 0 24 16" aria-hidden="true"><path d="M5 8.5 L9.5 13 L19 3" /></svg>
          </button>
        </section>
      </div>
    </template>

    <template id="town-hall-slot-template">
      <li class="town-hall__slot">
        <button class="town-hall__building" type="button">
          <span class="town-hall__picture" aria-hidden="true"></span>
          <span class="town-hall__name"></span>
        </button>
        <span class="town-hall__status visually-hidden"></span>
      </li>
    </template>

    <!-- A building picked in the Hall: what it costs, what it still needs, and Build. -->
    <template id="building-window-template">
      <section class="building-window message-box" role="dialog" aria-modal="true">
        <h3 class="building-window__name"></h3>
        <div class="building-window__picture town-hall__picture" aria-hidden="true"></div>
        <p class="building-window__note"></p>
        <ul class="building-window__cost" aria-label="Cost"></ul>
        <div class="building-window__buttons">
          <button class="building-window__button" type="button" data-building-action="build" aria-label="Build" aria-keyshortcuts="Enter" title="Build (Enter)">
            <svg class="town-hall__check" viewBox="0 0 24 16" aria-hidden="true"><path d="M5 8.5 L9.5 13 L19 3" /></svg>
          </button>
          <button class="building-window__button" type="button" data-building-action="cancel" aria-label="Cancel" aria-keyshortcuts="Escape" title="Cancel (Escape)">
            <svg class="town-hall__cross" viewBox="0 0 24 16" aria-hidden="true"><path d="M7 2 L17 14 M17 2 L7 14" /></svg>
          </button>
        </div>
      </section>
    </template>

    <!--
      The Fort window: a card for each creature tier, the dwelling and how many are available, the
      creature and its stats. Clicking a built dwelling's card opens its recruit window.
    -->
    <template id="fort-window-template">
      <div class="town-hall-backdrop">
        <section class="town-hall fort-window" role="dialog" aria-modal="true">
          <h2 class="town-hall__title fort-window__title"></h2>
          <div class="fort-window__cards"></div>
          <button class="town-hall__close" type="button" data-fort-action="close" aria-label="Close" aria-keyshortcuts="Enter Escape" title="Close (Enter)">
            <svg class="town-hall__check" viewBox="0 0 24 16" aria-hidden="true"><path d="M5 8.5 L9.5 13 L19 3" /></svg>
          </button>
        </section>
      </div>
    </template>

    <template id="fort-card-template">
      <article class="fort-card">
        <div class="fort-card__dwelling">
          <h3 class="fort-card__name"></h3>
          <div class="fort-card__dwelling-picture town-hall__picture" aria-hidden="true"></div>
          <p class="fort-card__dwelling-name"></p>
          <p class="fort-card__available"></p>
        </div>
        <div class="fort-card__creature entity--monster" aria-hidden="true"></div>
        <dl class="fort-card__stats"></dl>
      </article>
    </template>

    <!--
      A dwelling's recruit window, over the darkened town screen: its creatures, the upgraded one
      chosen first; what one costs, how many are available, how many to recruit and what they cost;
      the slider, and Max, Recruit and Cancel.
    -->
    <template id="recruit-window-template">
      <div class="town-hall-backdrop">
        <section class="recruit-window message-box" role="dialog" aria-modal="true" tabindex="-1">
          <h3 class="recruit-window__title"></h3>
          <div class="recruit-window__creatures" role="group" aria-label="Creatures"></div>
          <div class="recruit-window__boxes">
            <div class="recruit-window__box">
              <span class="recruit-window__label">Cost Per Troop</span>
              <ul class="recruit-window__cost" aria-label="Cost per troop"></ul>
            </div>
            <div class="recruit-window__box">
              <span class="recruit-window__label">Available</span>
              <span class="recruit-window__available" aria-label="Available"></span>
            </div>
            <div class="recruit-window__box" aria-hidden="true">
              <span class="recruit-window__label">Recruit</span>
              <span class="recruit-window__count"></span>
            </div>
            <div class="recruit-window__box">
              <span class="recruit-window__label">Total Cost</span>
              <ul class="recruit-window__total" aria-label="Total cost"></ul>
            </div>
          </div>
          <div class="recruit-window__slider-row">
            <button class="recruit-window__arrow" type="button" data-recruit-action="fewer" aria-label="Fewer" title="Fewer">&#9664;</button>
            <input class="recruit-window__slider" type="range" min="0" max="0" step="1" value="0" aria-label="Number to recruit" />
            <button class="recruit-window__arrow" type="button" data-recruit-action="more" aria-label="More" title="More">&#9654;</button>
          </div>
          <div class="building-window__buttons">
            <button class="building-window__button recruit-window__max" type="button" data-recruit-action="max" aria-label="Max" title="Max">Max</button>
            <button class="building-window__button" type="button" data-recruit-action="recruit" aria-label="Recruit" aria-keyshortcuts="Enter" title="Recruit (Enter)">
              <svg class="town-hall__check" viewBox="0 0 24 16" aria-hidden="true"><path d="M5 8.5 L9.5 13 L19 3" /></svg>
            </button>
            <button class="building-window__button" type="button" data-recruit-action="cancel" aria-label="Cancel" aria-keyshortcuts="Escape" title="Cancel (Escape)">
              <svg class="town-hall__cross" viewBox="0 0 24 16" aria-hidden="true"><path d="M7 2 L17 14 M17 2 L7 14" /></svg>
            </button>
          </div>
        </section>
      </div>
    </template>

    <!-- A message over the town screen, with OK, such as there being no room for recruits. -->
    <template id="town-message-template">
      <div class="town-hall-backdrop town-message-backdrop">
        <section class="town-message message-box" role="alertdialog" aria-modal="true" aria-label="Message" tabindex="-1">
          <p class="town-message__text"></p>
          <div class="building-window__buttons">
            <button class="building-window__button" type="button" data-town-message-action="close" aria-label="OK" aria-keyshortcuts="Enter Escape" title="OK (Enter)">
              <svg class="town-hall__check" viewBox="0 0 24 16" aria-hidden="true"><path d="M5 8.5 L9.5 13 L19 3" /></svg>
            </button>
          </div>
        </section>
      </div>
    </template>

    <script type="module" src="./main.js"></script>
  </body>
</html>
