name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Shared with the other workflow that pushes to gh-pages, so their pushes run one at a time.
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build site
        run: node scripts/build-site.mjs _site

      - name: Publish to gh-pages root
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
          branch: gh-pages
          # PR previews live in pr-preview/ on the same branch; keep them.
          clean-exclude: pr-preview/
