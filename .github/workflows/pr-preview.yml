name: PR preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  preview:
    # Forked PRs get a read-only token and cannot push to gh-pages.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build site
        if: github.event.action != 'closed'
        run: node scripts/build-site.mjs _site --without-music

      # Deploys to gh-pages/pr-preview/pr-<number>/, comments the URL on the PR,
      # and removes the preview when the PR is closed.
      - uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: _site
